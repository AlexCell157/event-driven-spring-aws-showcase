spring.application.name=event-driven-spring-aws-showcase

server.port=8081

# ===================================================================
# 1. AWS / LOCALSTACK CONFIGURATION (eu-central-1 / Frankfurt)
# ===================================================================
# LocalStack dummy credentials
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
spring.cloud.aws.region.static=eu-central-1

# Route AWS service endpoints explicitly to local Docker container
spring.cloud.aws.s3.endpoint=http://localhost:4566
spring.cloud.aws.dynamodb.endpoint=http://localhost:4566

# S3 configuration for LocalStack (requires path-style access)
spring.cloud.aws.s3.fips-enabled=false
spring.cloud.aws.s3.dualstack-enabled=false

# Cloud resource names provisioned via Terraform
custom.aws.s3.bucket-name=ecommerce-order-archive-showcase
custom.aws.dynamodb.analytics-table=ECommerceAnalyticsDashboard
custom.aws.dynamodb.processed-table=ProcessedOrders

# ===================================================================
# 2. APACHE KAFKA CONFIGURATION
# ===================================================================
# Connection to Kafka broker started via Docker Compose
spring.kafka.bootstrap-servers=localhost:9092

# Producer configuration (Publishing events)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# "all" ensures maximum data durability across replicas
spring.kafka.producer.acks=all 

# Consumer configuration (Receiving events)
spring.kafka.consumer.group-id=ecommerce-showcase-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Start from earliest available event if no committed offset exists
spring.kafka.consumer.auto-offset-reset=earliest 

# Kafka topic name configuration
custom.kafka.topic-name=orders-v1
