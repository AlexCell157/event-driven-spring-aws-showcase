spring.application.name=event-driven-spring-aws-showcase

server.port=8081

# ===================================================================
# 1. AWS / LOCALSTACK CONFIGURATION (eu-central-1 / Frankfurt)
# ===================================================================
# LocalStack standardmäßig mit Dummy-Daten füttern
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test
spring.cloud.aws.region.static=eu-central-1

# Endpunkte explizit auf deinen lokalen Docker-Container umbiegen
spring.cloud.aws.s3.endpoint=http://localhost:4566
spring.cloud.aws.dynamodb.endpoint=http://localhost:4566

# Wichtig für lokales S3 (LocalStack benötigt Path-Style Zugriff)
spring.cloud.aws.s3.fips-enabled=false
spring.cloud.aws.s3.dualstack-enabled=false

# Namen der in Terraform definierten Ressourcen bereitstellen
custom.aws.s3.bucket-name=ecommerce-order-archive-showcase
custom.aws.dynamodb.analytics-table=ECommerceAnalyticsDashboard
custom.aws.dynamodb.processed-table=ProcessedOrders

# ===================================================================
# 2. APACHE KAFKA CONFIGURATION
# ===================================================================
# Verbindung zum Kafka-Broker, den wir via Docker Compose gestartet haben
spring.kafka.bootstrap-servers=localhost:9092

# Producer-Einstellungen (Daten senden)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# "all" sorgt für maximale Datensicherheit im Cluster (US-Standard)
spring.kafka.producer.acks=all 

# Consumer-Einstellungen (Daten empfangen)
spring.kafka.consumer.group-id=ecommerce-showcase-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Startet beim ältesten verfügbaren Event, falls keine Positionsmarke existiert
spring.kafka.consumer.auto-offset-reset=earliest 

# Topic Name als Variable hinterlegen
custom.kafka.topic-name=orders-v1
